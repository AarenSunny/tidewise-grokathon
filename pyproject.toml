[project]
name = "tidewise"
version = "0.1.0"
requires-python = ">=3.11"
description = "TideWise — water recreation recommendations from live Earth-observation data"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: optional live NOAA/NWS smoke; set TIDEWISE_LIVE=1",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  "backend/adapters/coops.py",
  "backend/adapters/ndbc.py",
  "backend/adapters/erddap.py",
  "backend/adapters/charm.py",
  "backend/adapters/cdph.py",
  "backend/adapters/beachwatch.py",
  "backend/adapters/epa_uv.py",
  "backend/adapters/daylight.py",
  "backend/seasons.py",
  "backend/config/seasons.yaml",
  "backend/geo",
  "backend/features",
  "backend/scorers",
  "backend/models/features.py",
  "scripts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# frozen shared interfaces / agent-owned tests: no cosmetic churn
"backend/models/*" = ["F401", "I001"]
"tests/test_seasons_gear.py" = ["I001", "B007"]
"tests/test_scorers.py" = ["F401", "B033"]
"tests/test_windows_solar_beaches.py" = ["I001", "F401", "F841"]
